<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>MRJXYZ</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(135deg,#111827,#1e293b,#0f172a);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:25px;
}
.container{
  width:100%;
  max-width:600px;
  text-align:center;
}
.avatar{
  width:90px;
  height:90px;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(135deg,#6366f1,#06b6d4);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:800;
  box-shadow:0 10px 40px rgba(0,0,0,.35);
}
h1{margin:18px 0 6px;font-size:30px}
.desc{color:#94a3b8;margin-bottom:28px}
.links{
  display:flex;
  flex-direction:column;
  gap:14px;
}
.links a{
  display:block;
  padding:16px 20px;
  border-radius:14px;
  text-decoration:none;
  color:#fff;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(10px);
  transition:.25s;
}
.links a:hover{
  transform:translateY(-3px);
  background:rgba(255,255,255,.15);
}
.footer{
  margin-top:28px;
  color:#64748b;
  font-size:13px;
}
</style>
</head>

<body>
<div class="container">

  <div class="avatar">M</div>

  <h1>MRJXYZ</h1>
  <div class="desc">Welcome to my GitHub Pages</div>

  <div class="links">
    <a href="https://github.com/mrjxyz" target="_blank">
      💻 GitHub
    </a>

    <a href="https://github.com/mrjxyz?tab=repositories" target="_blank">
      📦 我的项目
    </a>

    <a href="https://github.com/mrjxyz/mrjxyz.github.io" target="_blank">
      🌐 网站源码
    </a>
  </div>

  <div class="footer">
    © 2026 MRJXYZ · Powered by GitHub Pages
  </div>

</div>
</body>
</html>
